<!doctype html>
<html lang="en" class="light-mode">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Mivon Creative Agency</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-body: #111111;
        --bg-card: #1b1b1b;
        --text-white: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.65);
        --text-muted: rgba(255, 255, 255, 0.45);
        --border-subtle: rgba(255, 255, 255, 0.08);
        --border-interactive: rgba(255, 255, 255, 0.2);
        --ease-mivon: cubic-bezier(0.19, 1, 0.22, 1);
        --transition-speed: 0.45s;
        --font-main: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;

        /* Glow override */
        --glow-color: rgba(255, 255, 255, 0.04);

        /* Button variables */
        --btn-primary-bg: #ffffff;
        --btn-primary-text: #000000;
        --btn-circle-bg: #000000;
        --btn-circle-stroke: #ffffff;
        --btn-shadow: rgba(255, 255, 255, 0.15);
      }

      /* Light Mode Variables Override */
      html.light-mode {
        --bg-body: #f8f9fa;
        --bg-card: #ffffff;
        --text-white: #111111;
        --text-secondary: rgba(17, 17, 17, 0.65);
        --text-muted: rgba(17, 17, 17, 0.45);
        --border-subtle: rgba(17, 17, 17, 0.08);
        --border-interactive: rgba(17, 17, 17, 0.2);
        --glow-color: rgba(0, 0, 0, 0.04);

        /* Button variables override for Light Mode */
        --btn-primary-bg: #111111;
        --btn-primary-text: #ffffff;
        --btn-circle-bg: #ffffff;
        --btn-circle-stroke: #111111;
        --btn-shadow: rgba(17, 17, 17, 0.15);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        cursor: none; /* Custom cursor override */
      }

      html,
      body {
        background-color: var(--bg-body);
        color: var(--text-white);
        font-family: var(--font-main);
        overflow: hidden;
        width: 100%;
        height: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition:
          background-color 0.5s var(--ease-mivon),
          color 0.5s var(--ease-mivon);
      }

      /* Fallback standard cursor for touch/mobile screens */
      @media (pointer: coarse) {
        * {
          cursor: auto !important;
        }
        .custom-cursor-dot,
        .custom-cursor-ring {
          display: none !important;
        }
      }

      .custom-cursor-dot {
        position: fixed;
        top: 0;
        left: 0;
        width: 8px;
        height: 8px;
        background-color: var(--text-white);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
        transition:
          width 0.3s var(--ease-mivon),
          height 0.3s var(--ease-mivon),
          background-color 0.3s var(--ease-mivon);
      }

      .custom-cursor-ring {
        position: fixed;
        top: 0;
        left: 0;
        width: 38px;
        height: 38px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9998;
        transform: translate(-50%, -50%);
        transition:
          width 0.3s var(--ease-mivon),
          height 0.3s var(--ease-mivon),
          border-color 0.3s var(--ease-mivon),
          background-color 0.3s var(--ease-mivon);
      }
      html.light-mode .custom-cursor-ring {
        border-color: rgba(17, 17, 17, 0.35);
      }

      body.hovering-interactive .custom-cursor-dot {
        width: 4px;
        height: 4px;
        background-color: #ffffff;
      }
      html.light-mode body.hovering-interactive .custom-cursor-dot {
        background-color: #111111;
      }

      body.hovering-interactive .custom-cursor-ring {
        width: 60px;
        height: 60px;
        border-color: rgba(255, 255, 255, 0.8);
        background-color: rgba(255, 255, 255, 0.05);
      }
      html.light-mode body.hovering-interactive .custom-cursor-ring {
        border-color: rgba(17, 17, 17, 0.8);
        background-color: rgba(17, 17, 17, 0.05);
      }

      /* Theme Toggle Button */
      .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #8b5cf6;
        border: none;
        cursor: pointer;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 16px rgba(139, 92, 246, 0.4);
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      .theme-toggle:hover {
        transform: scale(1.08);
        box-shadow: 0 6px 24px rgba(139, 92, 246, 0.6);
      }

      .theme-toggle svg {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        transition:
          opacity 0.3s ease,
          transform 0.3s ease;
        width: 24px;
        height: 24px;
        stroke: #ffffff;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      .theme-toggle .sun-icon {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
        pointer-events: none;
      }

      .theme-toggle .moon-icon {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
        pointer-events: auto;
      }

      html.light-mode .theme-toggle .sun-icon {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
        pointer-events: auto;
      }

      html.light-mode .theme-toggle .moon-icon {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
        pointer-events: none;
      }

      .bg-atmosphere {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }

      .radial-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 80vw;
        height: 80vh;
        background: radial-gradient(
          circle,
          var(--glow-color) 0%,
          rgba(17, 17, 17, 0) 70%
        );
        border-radius: 50%;
        transition: background 0.5s var(--ease-mivon);
      }

      .bg-globe-svg {
        position: absolute;
        top: 50%;
        left: 50%;
        width: clamp(600px, 85vw, 1200px);
        height: clamp(600px, 85vw, 1200px);
        transform: translate(-50%, -50%);
        opacity: 0.035;
        animation: globeSpin 140s linear infinite;
        transform-origin: center center;
      }
      html.light-mode .bg-globe-svg {
        opacity: 0.04; /* Slightly more visible on light bg */
      }

      @keyframes globeSpin {
        from {
          transform: translate(-50%, -50%) rotate(0deg);
        }
        to {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }

      .hero-404 {
        position: relative;
        z-index: 1;
        height: 100vh;
        width: 100vw;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        margin: 0 auto;
      }

      .hero-typography-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        margin-bottom: -15px;
        user-select: none;
      }

      .background-stroke-text {
        position: absolute;
        font-size: clamp(140px, 28vw, 400px);
        font-weight: 800;
        letter-spacing: -8px;
        color: transparent;
        -webkit-text-stroke: 1.5px var(--border-interactive);
        z-index: -1;
        text-transform: uppercase;
        pointer-events: none;
        transform: translateY(-10px);
        transition:
          transform 0.1s ease-out,
          -webkit-text-stroke 0.5s var(--ease-mivon);
      }

      .hero-number {
        font-size: clamp(120px, 22vw, 320px);
        font-weight: 700;
        line-height: 0.85;
        letter-spacing: -10px;
        color: var(--text-white);
        margin: 0;
        text-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        transition:
          transform 0.1s ease-out,
          color 0.5s var(--ease-mivon);
      }

      .hero-content {
        max-width: 650px;
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .hero-title {
        font-size: clamp(36px, 5vw, 64px);
        font-weight: 600;
        line-height: 1;
        letter-spacing: -1.5px;
        color: var(--text-white);
        transition: color 0.5s var(--ease-mivon);
      }

      .hero-description {
        font-size: clamp(15px, 1.8vw, 18px);
        font-weight: 400;
        line-height: 1.6;
        color: var(--text-secondary);
        max-width: 580px;
        transition: color 0.5s var(--ease-mivon);
      }

      .button-group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 16px;
        margin-top: 10px;
      }

      .btn-primary-mivon {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        background-color: var(--btn-primary-bg);
        color: var(--btn-primary-text);
        text-decoration: none;
        padding: 10px 10px 10px 30px;
        border-radius: 100px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.5px;
        border: 1px solid var(--btn-primary-bg);
        transition:
          transform var(--transition-speed) var(--ease-mivon),
          box-shadow var(--transition-speed) var(--ease-mivon),
          background-color 0.5s var(--ease-mivon),
          color 0.5s var(--ease-mivon);
      }

      .btn-primary-mivon .btn-icon-circle {
        width: 40px;
        height: 40px;
        background-color: var(--btn-circle-bg);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform var(--transition-speed) var(--ease-mivon);
      }

      .btn-primary-mivon .btn-icon-circle svg {
        width: 16px;
        height: 16px;
        stroke: var(--btn-circle-stroke);
        stroke-width: 2;
        fill: none;
        transition: transform var(--transition-speed) var(--ease-mivon);
      }

      .btn-primary-mivon:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 30px var(--btn-shadow);
      }

      .btn-primary-mivon:hover .btn-icon-circle {
        transform: scale(1.05);
      }

      .btn-primary-mivon:hover .btn-icon-circle svg {
        transform: translate(3px, -3px);
      }

      .btn-secondary-mivon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 18px 36px;
        border-radius: 100px;
        border: 1px solid var(--border-interactive);
        background-color: transparent;
        color: var(--text-white);
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: all var(--transition-speed) var(--ease-mivon);
      }

      .btn-secondary-mivon:hover {
        background-color: var(--text-white);
        color: #000000;
        border-color: var(--text-white);
        transform: translateY(-4px);
      }

      .fade-up-element {
        opacity: 0;
        transform: translateY(30px);
        transition:
          opacity 0.8s var(--ease-mivon),
          transform 0.8s var(--ease-mivon);
      }

      .fade-up-element.is-visible {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <!-- Custom Magnetic Cursor -->
    <div class="custom-cursor-dot" id="cursorDot"></div>
    <div class="custom-cursor-ring" id="cursorRing"></div>

    <!-- Theme Toggle Button -->
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <svg class="sun-icon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="5"></circle>
        <path
          d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
        ></path>
      </svg>
      <svg class="moon-icon" viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <!-- Ambient Dynamic Globe & Gradient Background -->
    <div class="bg-atmosphere">
      <div class="radial-glow"></div>
      <svg
        class="bg-globe-svg"
        viewBox="0 0 500 500"
        xmlns="http://www.w3.org/2000/svg"
      >
        <g
          fill="none"
          stroke="#FFFFFF"
          stroke-width="1.2"
          stroke-dasharray="2 6"
        >
          <circle cx="250" cy="250" r="230" />
          <ellipse cx="250" cy="250" rx="230" ry="50" />
          <ellipse cx="250" cy="250" rx="230" ry="110" />
          <ellipse cx="250" cy="250" rx="230" ry="170" />
          <ellipse cx="250" cy="250" rx="230" ry="210" />
          <ellipse cx="250" cy="250" rx="50" ry="230" />
          <ellipse cx="250" cy="250" rx="110" ry="230" />
          <ellipse cx="250" cy="250" rx="170" ry="230" />
          <ellipse cx="250" cy="250" rx="210" ry="230" />
          <g transform="rotate(30 250 250)">
            <ellipse cx="250" cy="250" rx="230" ry="90" />
            <ellipse cx="250" cy="250" rx="90" ry="230" />
          </g>
          <g transform="rotate(-30 250 250)">
            <ellipse cx="250" cy="250" rx="230" ry="90" />
            <ellipse cx="250" cy="250" rx="90" ry="230" />
          </g>
        </g>
      </svg>
    </div>

    <main class="hero-404">
      <div class="hero-typography-wrapper fade-up-element" id="heroTypography">
        <span class="background-stroke-text" id="strokeText">LOST</span>
        <h1 class="hero-number" id="heroNumber">404</h1>
      </div>

      <div class="hero-content">
        <h2 class="hero-title fade-up-element">Oops! Page Not Found</h2>
        <p class="hero-description fade-up-element">
          The page you're looking for may have been moved, renamed, or no longer
          exists. Let's guide you back to something meaningful.
        </p>

        <div class="button-group fade-up-element">
          <a href="./index.html" class="btn-primary-mivon">
            <span>BACK HOME</span>
            <span class="btn-icon-circle">
              <svg viewBox="0 0 24 24">
                <line x1="7" y1="17" x2="17" y2="7"></line>
                <polyline points="7 7 17 7 17 17"></polyline>
              </svg>
            </span>
          </a>
          <a href="javascript:history.back()" class="btn-secondary-mivon">
            Go Back
          </a>
        </div>
      </div>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        /* Interactive Cursor Physics */
        const cursorDot = document.getElementById("cursorDot");
        const cursorRing = document.getElementById("cursorRing");
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let ringX = mouseX;
        let ringY = mouseY;

        window.addEventListener("mousemove", function (e) {
          mouseX = e.clientX;
          mouseY = e.clientY;
          if (cursorDot) {
            cursorDot.style.left = mouseX + "px";
            cursorDot.style.top = mouseY + "px";
          }
        });

        function animateCursorRing() {
          ringX += (mouseX - ringX) * 0.15;
          ringY += (mouseY - ringY) * 0.15;
          if (cursorRing) {
            cursorRing.style.left = ringX + "px";
            cursorRing.style.top = ringY + "px";
          }
          requestAnimationFrame(animateCursorRing);
        }
        animateCursorRing();

        /* Magnetic Cursor Hover States */
        const interactives = document.querySelectorAll(
          "a, button, .btn-primary-mivon, .btn-secondary-mivon",
        );
        interactives.forEach((el) => {
          el.addEventListener("mouseenter", () =>
            document.body.classList.add("hovering-interactive"),
          );
          el.addEventListener("mouseleave", () =>
            document.body.classList.remove("hovering-interactive"),
          );
        });

        /* Parallax Effect on Mouse Move */
        const heroNumber = document.getElementById("heroNumber");
        const strokeText = document.getElementById("strokeText");

        window.addEventListener("mousemove", function (e) {
          const xPercent = (e.clientX / window.innerWidth - 0.5) * 2;
          const yPercent = (e.clientY / window.innerHeight - 0.5) * 2;

          if (heroNumber) {
            heroNumber.style.transform = `translate(${xPercent * 15}px, ${yPercent * 15}px)`;
          }
          if (strokeText) {
            strokeText.style.transform = `translate(${xPercent * -25}px, ${yPercent * -25}px)`;
          }
        });

        /* Reveal Animation on Load */
        setTimeout(() => {
          document
            .querySelectorAll(".fade-up-element")
            .forEach((el) => el.classList.add("is-visible"));
        }, 100);

        /* Theme Toggle Logic */
        const themeToggle = document.getElementById("themeToggle");
        const htmlElement = document.documentElement;

        themeToggle.addEventListener("click", () => {
          if (htmlElement.classList.contains("light-mode")) {
            htmlElement.classList.remove("light-mode");
          } else {
            htmlElement.classList.add("light-mode");
          }
        });
      });
    </script>
  </body>
</html>
